name: Car Compatibility / Bug Report
description: Report how Comfort & Startup works on your Gen5W vehicle or report an issue
title: "[Car Report] "
body:
  - type: input
    id: car
    attributes:
      label: Vehicle Year, Make, Model & Trim
      placeholder: "2024 Hyundai Ioniq 5 Limited (US)"
    validations:
      required: true
  - type: input
    id: firmware
    attributes:
      label: Infotainment Software Version
      placeholder: "NEEV23.USA.0000.V016.010.260903"
    validations:
      required: true
  - type: input
    id: versions
    attributes:
      label: Comfort & HMG-API Versions
      placeholder: "Comfort 1.1.1, HMG-API 1.1.0-rc.3"
    validations:
      required: true
  - type: textarea
    id: details
    attributes:
      label: What Worked / What Happened
      description: Share which features you tested (startup notice dismissal, seat heat, seat ventilation, steering wheel heat) and attach or paste the Comfort log from the HMG-API app if reporting a bug.
    validations:
      required: true
